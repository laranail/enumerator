name: Coverage

# Single-job workflow that runs Pest with coverage on PHP 8.3 (the
# floor) and reports it two ways:
#
#   - a job summary (total, the enforced floor, the lowest-covered
#     files) written by scripts/coverage-summary.php from the Clover
#     report phpunit.xml configures (coverage.xml);
#   - coverage.xml kept as a short-retention artifact.
#
# The floor is enforced by `pest --coverage --min` across the full
# PHP 8.3 / 8.4 / 8.5 matrix in ci.yml (and by `composer test:coverage`
# locally); the summary reads it from composer.json.
#
# coverage-baseline.yml runs the same steps against `main` weekly, so
# drift after a merge stays visible without a push trigger.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-coverage-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Verify Alpine bundle SRI
        # Same guard as ci.yml — fail fast if the bundle drifts before
        # we waste coverage time.
        run: |
          BUNDLED_SRI="sha384-$(shasum -a 384 -b resources/js/alpine.min.js | awk '{print $1}' | xxd -r -p | base64)"
          PINNED_SRI=$(php -r "function env(\$k, \$d = null) { return \$d; } echo (require 'config/enumerator.php')['alpine']['integrity'];")
          if [ "$BUNDLED_SRI" != "$PINNED_SRI" ]; then
            echo "::error::Alpine SRI mismatch"
            exit 1
          fi

      - name: Pest with coverage
        # phpunit.xml configures the Clover output path (coverage.xml).
        # No --min gate here; the floor lives in ci.yml.
        run: vendor/bin/pest --coverage

      - name: Coverage summary
        # always(): show the numbers even when the run fails.
        if: always() && hashFiles('coverage.xml') != ''
        run: php scripts/coverage-summary.php

      - name: Keep coverage.xml
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.sha }}
          path: coverage.xml
          retention-days: 7
