# Dedicated PHPStan job with `--error-format=github` so static-analysis
# errors surface as inline annotations on PR diffs. The PHPStan step in
# `ci.yml` already runs across the full PHP matrix; this workflow exists
# only to add the inline-annotation channel for reviewers. Do not delete
# without first updating `ci.yml` to use `--error-format=github` too.

name: Static Analysis

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The family's Pint rules live in laranail/package-tools, which every other
      # package runs through vendor/bin/laranail-pint. This one cannot: it supports
      # PHP ^8.3 and package-tools needs ^8.4.1, so composer refuses it even as a dev
      # dependency. pint.json is therefore a copy of the shared config, and a copy
      # drifts unless something fails when it does. This is that something; a failed
      # download fails the step too, rather than passing on nothing. It sits in this
      # job rather than ci.yml because it needs to run once, not once per PHP version.
      - name: Local Pint config matches the shared one
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/laranail/package-tools/main/pint.json \
            -o "$RUNNER_TEMP/shared-pint.json"
          jq -S . "$RUNNER_TEMP/shared-pint.json" > "$RUNNER_TEMP/shared.json"
          jq -S . pint.json > "$RUNNER_TEMP/local.json"
          diff -u "$RUNNER_TEMP/shared.json" "$RUNNER_TEMP/local.json" \
            || { echo "::error file=pint.json::pint.json has drifted from laranail/package-tools' pint.json; copy it across."; exit 1; }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - run: composer install --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress --error-format=github
