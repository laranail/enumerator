name: Coverage baseline

# Refreshes the Codecov baseline for `main` so PR comparisons have a recent
# base commit to diff against. Runs weekly (Monday 06:00 America/New_York,
# 11:00 UTC) and on demand; scheduled runs always use the default branch.
# It stands in for a `push: branches: [main]` trigger, which would re-run
# coverage after every merge. Steps mirror coverage.yml, including the job
# summary, the kept coverage.xml and the warning on a rejected upload.

on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-coverage-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Verify Alpine bundle SRI
        # Same guard as ci.yml — fail fast if the bundle drifts before
        # we waste coverage time.
        run: |
          BUNDLED_SRI="sha384-$(shasum -a 384 -b resources/js/alpine.min.js | awk '{print $1}' | xxd -r -p | base64)"
          PINNED_SRI=$(php -r "function env(\$k, \$d = null) { return \$d; } echo (require 'config/enumerator.php')['alpine']['integrity'];")
          if [ "$BUNDLED_SRI" != "$PINNED_SRI" ]; then
            echo "::error::Alpine SRI mismatch"
            exit 1
          fi

      - name: Pest with coverage
        # phpunit.xml configures the Clover output path (coverage.xml).
        # No --min gate here; the floor lives in ci.yml.
        run: vendor/bin/pest --coverage

      - name: Coverage summary
        # always(): show the numbers even when the run fails.
        if: always() && hashFiles('coverage.xml') != ''
        run: php scripts/coverage-summary.php

      - name: Keep coverage.xml
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-${{ github.sha }}
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        id: codecov
        # Advisory: the gate is `pest --min` in ci.yml, and the job summary
        # shows the numbers. fail_ci_if_error makes the CLI exit non-zero
        # when Codecov answers HTTP >= 400 (with it off, the action always
        # exits 0 and a rejection is silent); continue-on-error keeps that
        # from failing the job, and the next step makes it a visible warning.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: codecov-laranail-enumerator
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Report a rejected Codecov upload
        if: steps.codecov.outcome == 'failure'
        run: |
          msg="Codecov rejected the upload (repository not activated or token mismatch) — coverage is still enforced by pest --min in ci.yml and shown in the job summary. See the 'Upload coverage to Codecov' step log for the server response."
          echo "::warning title=Codecov upload failed::$msg"
          printf '\n> [!WARNING]\n> %s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
